spring.application.name=bagcontrol

tasf.b2b.data.aeropuertos=classpath:data/c.1inf54.26.1.v1.Aeropuerto.husos.v1.20250818__estudiantes.txt
tasf.b2b.data.vuelos=classpath:data/planes_vuelo.txt
tasf.b2b.data.envios=classpath:data/envios.zip

# Datasource
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=8090

# Tabu puede usar hasta 30 s; el SA adaptativo crece hasta 45 s si el TA lo requiere.
simulacion.planificacion.timeout-ms=30000
# Parámetros de Tabu Search. Se ajustan por propiedades para experimentar sin cambiar el código.
simulacion.planificacion.tabu.iteraciones=500
simulacion.planificacion.tabu.tenure=25
simulacion.planificacion.tabu.max-vecinos=200
# Reserva operativa para absorber desfases entre rutas proyectadas y eventos físicos.
simulacion.planificacion.margen-capacidad=0.0
